<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" font-family="Arial, 'Malgun Gothic', sans-serif">
  <rect width="600" height="300" fill="#ffffff"/>

  <!-- 그래프 -->
  <text x="140" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">그래프</text>
  <g stroke="#555555" stroke-width="2">
    <line x1="70" y1="90" x2="210" y2="90"/>
    <line x1="70" y1="90" x2="70" y2="230"/>
    <line x1="210" y1="90" x2="70" y2="230"/>
    <line x1="210" y1="90" x2="210" y2="230"/>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
    <circle cx="70" cy="90" r="22"/>
    <circle cx="210" cy="90" r="22"/>
    <circle cx="70" cy="230" r="22"/>
    <circle cx="210" cy="230" r="22"/>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">
    <text x="70" y="96">0</text>
    <text x="210" y="96">1</text>
    <text x="70" y="236">2</text>
    <text x="210" y="236">3</text>
  </g>

  <!-- 인접행렬 -->
  <text x="440" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">인접행렬</text>

  <!-- 값이 1인 칸 -->
  <g fill="#bfdbfe">
    <rect x="400" y="80" width="40" height="40"/>
    <rect x="440" y="80" width="40" height="40"/>
    <rect x="360" y="120" width="40" height="40"/>
    <rect x="440" y="120" width="40" height="40"/>
    <rect x="480" y="120" width="40" height="40"/>
    <rect x="360" y="160" width="40" height="40"/>
    <rect x="400" y="160" width="40" height="40"/>
    <rect x="400" y="200" width="40" height="40"/>
  </g>

  <!-- 격자 -->
  <g stroke="#555555" stroke-width="1.5" fill="none">
    <rect x="360" y="80" width="160" height="160"/>
    <line x1="400" y1="80" x2="400" y2="240"/>
    <line x1="440" y1="80" x2="440" y2="240"/>
    <line x1="480" y1="80" x2="480" y2="240"/>
    <line x1="360" y1="120" x2="520" y2="120"/>
    <line x1="360" y1="160" x2="520" y2="160"/>
    <line x1="360" y1="200" x2="520" y2="200"/>
  </g>

  <!-- 행/열 번호 -->
  <g text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">
    <text x="380" y="70">0</text>
    <text x="420" y="70">1</text>
    <text x="460" y="70">2</text>
    <text x="500" y="70">3</text>
    <text x="342" y="106">0</text>
    <text x="342" y="146">1</text>
    <text x="342" y="186">2</text>
    <text x="342" y="226">3</text>
  </g>

  <!-- 값 -->
  <g text-anchor="middle" font-size="16" fill="#222222">
    <text x="380" y="106">0</text>
    <text x="420" y="106">1</text>
    <text x="460" y="106">1</text>
    <text x="500" y="106">0</text>
    <text x="380" y="146">1</text>
    <text x="420" y="146">0</text>
    <text x="460" y="146">1</text>
    <text x="500" y="146">1</text>
    <text x="380" y="186">1</text>
    <text x="420" y="186">1</text>
    <text x="460" y="186">0</text>
    <text x="500" y="186">0</text>
    <text x="380" y="226">0</text>
    <text x="420" y="226">1</text>
    <text x="460" y="226">0</text>
    <text x="500" y="226">0</text>
  </g>
</svg>
